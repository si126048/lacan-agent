[project]
name = "lacan-agent"
version = "0.1.0"
description = "Evidence-constrained Lacan research workflow MVP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "pypdf>=5.0", "httpx>=0.28", "openai>=1.0", "aiosqlite>=0.20", "python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.5"]
[project.scripts]
lacan-agent = "lacan_agent.cli:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "none"
[tool.ruff]
line-length = 100
